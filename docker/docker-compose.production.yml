version: '3.9'

# ============================================================================
# AICaffe Platform - Production Docker Compose
# Complete microservices architecture with PostgreSQL, Redis, and all services
# ============================================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - aicaffe-net
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-python-service: &python-service
  <<: *service-defaults
  build:
    context: ../services
    dockerfile: ../docker/Dockerfile.python
  volumes:
    - ../services/shared:/app/shared:ro
  environment: &common-env
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: ${DB_USER:-aicaffe}
    DB_PASSWORD: ${DB_PASSWORD:-aicaffe_secure_pass}
    DB_NAME: ${DB_NAME:-aicaffe}
    DB_POOL_MIN: "2"
    DB_POOL_MAX: "20"
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    REDIS_URL: redis://redis:6379
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ENVIRONMENT: ${ENVIRONMENT:-production}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ══════════════════════════════════════════════════════════════════════════
  # Infrastructure Services
  # ══════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    container_name: aicaffe-postgres
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${DB_NAME:-aicaffe}
      POSTGRES_USER: ${DB_USER:-aicaffe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aicaffe_secure_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../database/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro
      - ../database/003_workspace.sql:/docker-entrypoint-initdb.d/003_workspace.sql:ro
      - ../database/004_storage.sql:/docker-entrypoint-initdb.d/004_storage.sql:ro
      - ../database/005_cloud_ide.sql:/docker-entrypoint-initdb.d/005_cloud_ide.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aicaffe} -d ${DB_NAME:-aicaffe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: aicaffe-redis
    <<: *service-defaults
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ══════════════════════════════════════════════════════════════════════════
  # API Gateway
  # ══════════════════════════════════════════════════════════════════════════

  api-gateway:
    <<: *python-service
    container_name: aicaffe-gateway
    build:
      context: ../services/api-gateway
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      <<: *common-env
      PORT: "8000"
      AUTH_SERVICE_URL: http://auth-service:8001
      MODEL_REGISTRY_URL: http://model-registry:8002
      TOKEN_SERVICE_URL: http://token-service:8003
      RECOMMENDATION_URL: http://recommendation-engine:8004
      NEWS_SERVICE_URL: http://news-aggregator:8005
      AI_PROXY_URL: http://ai-proxy-service:8006
      BILLING_SERVICE_URL: http://billing-service:8007
      STORAGE_SERVICE_URL: http://storage-service:8008
      WORKSPACE_SERVICE_URL: http://workspace-service:8009
      ORCHESTRATOR_SERVICE_URL: http://orchestrator-service:8010
      CLOUD_IDE_SERVICE_URL: http://cloud-ide:8011
      CORS_ORIGINS: ${CORS_ORIGINS:-https://aicaffe.com,https://app.aicaffe.com}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      auth-service:
        condition: service_healthy
      model-registry:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════════════════════
  # Core Services
  # ══════════════════════════════════════════════════════════════════════════

  auth-service:
    <<: *python-service
    container_name: aicaffe-auth
    build:
      context: ../services/auth-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8001"
    environment:
      <<: *common-env
      PORT: "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  model-registry:
    <<: *python-service
    container_name: aicaffe-models
    build:
      context: ../services/model-registry
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${MODEL_REGISTRY_PORT:-8002}:8002"
    environment:
      <<: *common-env
      PORT: "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  token-service:
    <<: *python-service
    container_name: aicaffe-tokens
    build:
      context: ../services/token-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${TOKEN_SERVICE_PORT:-8003}:8003"
    environment:
      <<: *common-env
      PORT: "8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  recommendation-engine:
    <<: *python-service
    container_name: aicaffe-recommend
    build:
      context: ../services/recommendation-engine
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${RECOMMENDATION_PORT:-8004}:8004"
    environment:
      <<: *common-env
      PORT: "8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  news-aggregator:
    <<: *python-service
    container_name: aicaffe-news
    build:
      context: ../services/news-aggregator
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${NEWS_SERVICE_PORT:-8005}:8005"
    environment:
      <<: *common-env
      PORT: "8005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ══════════════════════════════════════════════════════════════════════════
  # AI & Billing Services
  # ══════════════════════════════════════════════════════════════════════════

  ai-proxy-service:
    <<: *python-service
    container_name: aicaffe-aiproxy
    build:
      context: ../services/ai-proxy-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${AI_PROXY_PORT:-8006}:8006"
    environment:
      <<: *common-env
      PORT: "8006"
      TOKEN_SERVICE_URL: http://token-service:8003
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      token-service:
        condition: service_healthy

  billing-service:
    <<: *python-service
    container_name: aicaffe-billing
    build:
      context: ../services/billing-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${BILLING_SERVICE_PORT:-8007}:8007"
    environment:
      <<: *common-env
      PORT: "8007"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://aicaffe.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ══════════════════════════════════════════════════════════════════════════
  # Workspace & Storage Services
  # ══════════════════════════════════════════════════════════════════════════

  storage-service:
    <<: *python-service
    container_name: aicaffe-storage
    build:
      context: ../services/storage-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${STORAGE_SERVICE_PORT:-8008}:8008"
    environment:
      <<: *common-env
      PORT: "8008"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  workspace-service:
    <<: *python-service
    container_name: aicaffe-workspace
    build:
      context: ../services/workspace-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${WORKSPACE_SERVICE_PORT:-8009}:8009"
    environment:
      <<: *common-env
      PORT: "8009"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  orchestrator-service:
    <<: *python-service
    container_name: aicaffe-orchestrator
    build:
      context: ../services/orchestrator-service
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${ORCHESTRATOR_SERVICE_PORT:-8010}:8010"
    environment:
      <<: *common-env
      PORT: "8010"
      AI_PROXY_URL: http://ai-proxy-service:8006
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      ai-proxy-service:
        condition: service_healthy

  cloud-ide:
    <<: *python-service
    container_name: aicaffe-ide
    build:
      context: ../services/cloud-ide
      dockerfile: ../../docker/Dockerfile.python
    ports:
      - "${CLOUD_IDE_PORT:-8011}:8011"
    environment:
      <<: *common-env
      PORT: "8011"
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ══════════════════════════════════════════════════════════════════════════
  # Frontend
  # ══════════════════════════════════════════════════════════════════════════

  frontend:
    <<: *service-defaults
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: aicaffe-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      api-gateway:
        condition: service_healthy

# ══════════════════════════════════════════════════════════════════════════════
# Volumes
# ══════════════════════════════════════════════════════════════════════════════

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

# ══════════════════════════════════════════════════════════════════════════════
# Networks
# ══════════════════════════════════════════════════════════════════════════════

networks:
  aicaffe-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
